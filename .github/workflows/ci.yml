name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version pin matches this project's actual constraints, verified
      # locally: pubspec.yaml's environment.sdk (^3.12.2) and .metadata's
      # flutter (>=3.44.0) -- not a guess, this is the exact toolchain
      # `flutter pub get` / `flutter analyze` / `flutter test` were run
      # against and confirmed clean/passing on before this workflow was
      # written.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
